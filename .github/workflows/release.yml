name: Release

# main에 push되면 changeset을 확인한다.
# - 처리할 changeset이 있으면 "버전 갱신" PR을 만들거나 갱신한다.
# - 그 PR이 병합되면(changeset이 모두 소비된 상태) 버전이 오른 패키지만 npm에 배포한다.
# npm 토큰 없이 trusted publishing(OIDC)으로 인증한다. npmjs.com의 각 패키지 설정에
# 저장소 cp949/xx-libs와 이 파일명(release.yml)이 trusted publisher로 등록돼 있어야 한다.
# 파일명을 바꾸면 등록도 바꾼다. 절차는 docs/release.md를 따른다.
on:
  push:
    branches:
      - main

# 같은 브랜치의 배포가 겹치지 않게 한다. 진행 중인 배포는 취소하지 않는다.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write # 버전 갱신 브랜치 push, 태그·GitHub Release 생성
  pull-requests: write # 버전 갱신 PR 생성
  id-token: write # npm trusted publishing(OIDC)

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # changeset이 변경 이력과 비교하므로 전체 이력이 필요하다.
          fetch-depth: 0

      # trusted publishing은 npm CLI 11.5.1 이상이 필요하다. 이 Node에 번들된 npm을 쓴다.
      # registry-url은 지정하지 않는다. 지정하면 토큰 자리표시자가 담긴 .npmrc가 만들어져 OIDC 인증을 가린다.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.1

      - name: Activate pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@12.21.0 --activate

      - name: Install dependencies from lockfile
        run: pnpm install --frozen-lockfile

      # GITHUB_TOKEN으로 만든 PR에는 CI가 돌지 않는다. 배포 직전 검증을 여기서 한다.
      - name: Verify lint, format, types, tests, build and Chrome 75 gates
        run: pnpm verify

      - name: Create version PR or publish
        uses: changesets/action@v1
        with:
          # 루트 package.json의 version 스크립트와 이름이 같아 pnpm version이 아닌 changeset 명령을 직접 부른다.
          version: pnpm changeset version
          publish: pnpm changeset publish
          commit: 'chore: 패키지 버전 갱신'
          title: 'chore: 패키지 버전 갱신'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
