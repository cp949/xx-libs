name: Release

# main에 push되면 검증한 뒤 npm에 없는 버전의 패키지만 배포한다.
# 버전과 CHANGELOG는 push 전에 로컬에서 `pnpm changeset version`으로 올려 둔다. 이 워크플로는 올리지 않는다.
# npm 토큰 없이 trusted publishing(OIDC)으로 인증한다. npmjs.com의 각 패키지 설정에
# 저장소 cp949/xx-libs와 이 파일명(release.yml)이 trusted publisher로 등록돼 있어야 한다.
# 파일명을 바꾸면 등록도 바꾼다. 절차는 docs/release.md를 따른다.
on:
  push:
    branches:
      - main

# 같은 브랜치의 배포가 겹치지 않게 한다. 진행 중인 배포는 취소하지 않는다.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write # 배포한 패키지의 태그 push
  id-token: write # npm trusted publishing(OIDC)

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # trusted publishing은 npm CLI 11.5.1 이상이 필요하다. 이 Node에 번들된 npm을 쓴다.
      # registry-url은 지정하지 않는다. 지정하면 토큰 자리표시자가 담긴 .npmrc가 만들어져 OIDC 인증을 가린다.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.1

      - name: Activate pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@12.21.0 --activate

      - name: Install dependencies from lockfile
        run: pnpm install --frozen-lockfile

      # changeset이 남아 있으면 `pnpm changeset version`을 빠뜨린 것이다. 버전이 오르지 않은 채 배포되는 일을 막는다.
      - name: Fail if unconsumed changesets remain
        run: |
          pending=$(find .changeset -name '*.md' ! -name README.md)
          if [ -n "$pending" ]; then
            echo "처리하지 않은 changeset이 있다. pnpm changeset version을 실행해 커밋한다:"
            echo "$pending"
            exit 1
          fi

      - name: Verify lint, format, types, tests, build and Chrome 75 gates
        run: pnpm verify

      # 태그 생성에 git 사용자 정보가 필요하다.
      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # npm에 이미 있는 버전은 건너뛴다. 배포한 패키지마다 <패키지명>@<버전> 태그가 로컬에 만들어진다.
      - name: Publish packages
        run: pnpm changeset publish
        env:
          NPM_CONFIG_PROVENANCE: 'true'

      - name: Push release tags
        run: git push origin --tags
